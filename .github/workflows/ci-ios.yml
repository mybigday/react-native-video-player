name: CI Apple

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'example/ios/**'
      - 'example-tv/ios/**'
      - 'example-legacy/ios/**'
      - 'src/**'
      - '*.podspec'
      - 'package.json'
      - '.github/**'
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - 'example/ios/**'
      - 'example-tv/ios/**'
      - 'example-legacy/ios/**'
      - 'src/**'
      - '*.podspec'
      - 'package.json'
      - '.github/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # iPhone and iPad, on react-native.
          - name: ios
            workspace: example
            package: '@fugood/react-native-video-player-example'
            task: build:ios
          # Apple TV, on react-native-tvos.
          - name: tvos
            workspace: example-tv
            package: '@fugood/react-native-video-player-example-tv'
            task: build:tvos
          # The legacy (Paper) renderer, on the last React Native that supports
          # it — RCT_NEW_ARCH_ENABLED=0 is a no-op from 0.82 onwards.
          - name: ios-legacy
            workspace: example-legacy
            package: '@fugood/react-native-video-player-example-legacy'
            task: build:ios-legacy
    name: ${{ matrix.name }}
    env:
      TURBO_CACHE_DIR: .turbo/${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ${{ matrix.workspace }}

      - name: Cache turborepo
        uses: actions/cache@v4
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-${{ matrix.name }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-${{ matrix.name }}-

      # Exact-match only, no restore-keys: React Native keeps a prebuilt
      # React.xcframework inside Pods/ and swaps its Debug/Release slice through
      # a marker file that `pod install` will not re-check. Reusing a Pods
      # directory resolved from a different Podfile can therefore link against a
      # stale slice and fail with missing React-internal symbols.
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ${{ matrix.workspace }}/ios/Pods
          key: ${{ runner.os }}-cocoapods-${{ matrix.name }}-${{ hashFiles('yarn.lock', '*.podspec', format('{0}/ios/Podfile', matrix.workspace)) }}

      - name: Install pods
        run: yarn workspace ${{ matrix.package }} pods

      # `turbo run` exits 0 when a task name matches no workspace, which once
      # let three Apple jobs pass green in five seconds having built nothing.
      - name: Build
        run: |
          set -o pipefail
          yarn turbo run ${TASK} --filter="${PACKAGE}" \
            --cache-dir="${TURBO_CACHE_DIR}" 2>&1 | tee turbo.log
          if grep -q 'No tasks were executed' turbo.log; then
            echo "::error::turbo matched no task for ${TASK} in ${PACKAGE}"
            exit 1
          fi
        env:
          TASK: ${{ matrix.task }}
          PACKAGE: ${{ matrix.package }}
