name: CI Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'example/android/**'
      - 'example-tv/android/**'
      - 'example-legacy/android/**'
      - 'src/**'
      - 'package.json'
      - '.github/**'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'example/android/**'
      - 'example-tv/android/**'
      - 'example-legacy/android/**'
      - 'src/**'
      - 'package.json'
      - '.github/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Phones and tablets, on react-native.
          - name: android
            task: build:android
          # Android TV, on react-native-tvos.
          - name: android-tv
            task: build:androidtv
          # The legacy (Paper) renderer, on the last React Native that supports
          # it — 0.82's Gradle plugin force-enables the New Architecture.
          - name: android-legacy
            task: build:android-legacy
    name: ${{ matrix.name }}
    env:
      TURBO_CACHE_DIR: .turbo/${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache turborepo
        uses: actions/cache@v4
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-${{ matrix.name }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-${{ matrix.name }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties', '**/*.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Finalize Android SDK
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Build
        run: yarn turbo run ${{ matrix.task }} --cache-dir="${{ env.TURBO_CACHE_DIR }}"
