buildscript {
  ext.ReactNativeVideoPlayer = [
    kotlinVersion: "2.1.20",
    minSdkVersion: 24,
    compileSdkVersion: 36,
    javaVersion: JavaVersion.VERSION_17,
    agpVersion: "8.7.3",
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return ReactNativeVideoPlayer[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:${getExtOrDefault('agpVersion')}"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

/**
 * React Native 0.76 made the New Architecture the default and 0.82 removed the
 * opt-out entirely (its Gradle plugin force-sets `newArchEnabled=true` on every
 * subproject). Older templates always wrote the flag explicitly, so treating an
 * absent flag as "new architecture" is correct for every supported version.
 */
def isNewArchitectureEnabled() {
  for (name in ["newArchEnabled", "react.newArchEnabled"]) {
    if (project.hasProperty(name)) {
      return project.property(name).toString().toBoolean()
    }
  }
  return true
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

android {
  namespace "com.fugood.reactnativevideoplayer"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lint {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility getExtOrDefault("javaVersion")
    targetCompatibility getExtOrDefault("javaVersion")
  }

  sourceSets {
    main {
      // The view manager base class differs between architectures: on Fabric it
      // implements the codegen'd delegate interface, on the legacy renderer it
      // is a plain SimpleViewManager.
      java.srcDirs += [isNewArchitectureEnabled() ? "src/newarch" : "src/oldarch"]
    }
  }
}

kotlin {
  compilerOptions {
    jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(
      getExtOrDefault("javaVersion").toString()
    )
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  implementation "com.facebook.react:react-android"
}

if (isNewArchitectureEnabled()) {
  react {
    jsRootDir = file("../src/")
    libraryName = "ReactNativeVideoPlayerView"
    codegenJavaPackageName = "com.fugood.reactnativevideoplayer"
  }
}
